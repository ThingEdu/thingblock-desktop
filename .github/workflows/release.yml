name: release

# Publish Windows + macOS installers from a version tag. The build reaches into
# the sibling repos (editor, link), so all three are checked out side by side.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout thingblock-desktop
        uses: actions/checkout@v4
        with:
          repository: lgthevinh/thingblock-desktop
          path: thingblock-desktop

      - name: Checkout thingblock-editor
        uses: actions/checkout@v4
        with:
          repository: lgthevinh/thingblock-editor
          path: thingblock-editor

      - name: Checkout thingblock-link
        uses: actions/checkout@v4
        with:
          repository: lgthevinh/thingblock-link
          path: thingblock-link

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: thingblock-editor/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            thingblock-desktop/src-tauri
            thingblock-link

      - name: Install editor deps
        working-directory: thingblock-editor
        run: npm ci

      - name: Install desktop deps
        working-directory: thingblock-desktop
        run: npm ci

      # tauri-action runs beforeBuildCommand (stage:sidecar -> builds the link +
      # resource pack + stages arduino-cli; build:editor -> scratch-gui webpack),
      # then `tauri build`. On a tag push it also drafts the Release and uploads
      # the installers; on workflow_dispatch tagName is empty, so it only builds
      # (no release) and we upload the installers as workflow artifacts instead.
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # scratch-gui's webpack build is memory-hungry on hosted runners.
          NODE_OPTIONS: --max-old-space-size=4096
        with:
          projectPath: thingblock-desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "ThingBlock ${{ github.ref_name }}"
          releaseDraft: true

      - name: Upload installers (dispatch test runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: thingblock-${{ matrix.target }}
          path: |
            thingblock-desktop/src-tauri/target/release/bundle/dmg/*.dmg
            thingblock-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
