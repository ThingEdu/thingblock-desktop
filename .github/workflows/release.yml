name: release

# Publish Windows + macOS installers from a version tag. The build reaches into
# the sibling repos (editor, link), so all three are checked out side by side.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    # tauri-action creates the GitHub Release and uploads assets, which needs a
    # write-scoped token (repos default the workflow token to read-only).
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout thingblock-desktop
        uses: actions/checkout@v4
        with:
          repository: lgthevinh/thingblock-desktop
          path: thingblock-desktop

      - name: Checkout thingblock-editor
        uses: actions/checkout@v4
        with:
          repository: lgthevinh/thingblock-editor
          path: thingblock-editor

      - name: Checkout thingblock-link
        uses: actions/checkout@v4
        with:
          repository: lgthevinh/thingblock-link
          path: thingblock-link

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: thingblock-editor/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            thingblock-desktop/src-tauri
            thingblock-link

      # Tauri's Linux build needs webkit2gtk 4.1 + GTK; libxdo-dev provides libxdo,
      # which tray-icon/muda link against for X11 input simulation; patchelf/file are
      # for the AppImage bundler (Tauri fetches linuxdeploy itself; no FUSE/rpmbuild
      # needed).
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev \
            build-essential curl wget file patchelf

      - name: Install editor deps
        working-directory: thingblock-editor
        run: npm ci

      - name: Install desktop deps
        working-directory: thingblock-desktop
        run: npm ci

      # `npm ci` installs the editor workspace but does not build its packages.
      # scratch-gui (build:editor) and the resource pack (stage:sidecar) consume the
      # built dist/types of the shared @scratch/* libraries, so build those libs in
      # dependency order first. Excludes scratch-gui itself, whose production webpack
      # build is memory-hungry and is instead run as build:dev in beforeBuildCommand.
      - name: Build editor libraries
        working-directory: thingblock-editor
        run: npm run build:libs

      # tauri-action runs beforeBuildCommand (stage:sidecar -> builds the link +
      # resource pack + stages arduino-cli; build:editor -> scratch-gui webpack),
      # then `tauri build`. On a tag push it also drafts the Release and uploads
      # the installers; on workflow_dispatch tagName is empty, so it only builds
      # (no release) and we upload the installers as workflow artifacts instead.
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # scratch-gui's webpack build is memory-hungry on hosted runners.
          NODE_OPTIONS: --max-old-space-size=4096
        with:
          projectPath: thingblock-desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "ThingBlock ${{ github.ref_name }}"
          releaseDraft: true

      - name: Upload installers (dispatch test runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: thingblock-${{ matrix.target }}
          path: |
            thingblock-desktop/src-tauri/target/release/bundle/dmg/*.dmg
            thingblock-desktop/src-tauri/target/release/bundle/nsis/*.exe
            thingblock-desktop/src-tauri/target/release/bundle/deb/*.deb
            thingblock-desktop/src-tauri/target/release/bundle/rpm/*.rpm
            thingblock-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
